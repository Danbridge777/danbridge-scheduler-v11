name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danbridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.26.0

      - name: Validate project and JavaScript
        run: python3 tools/validate_project.py

      - name: Verify generated manifest is current
        run: git diff --exit-code -- docs/sha256-manifest.json

      - name: Run application scenarios
        run: npm test

      - name: Run Firestore Rules tests
        run: DANBRIDGE_JAVA_HOME="$JAVA_HOME" npm run test:rules

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm run test:dependency-audit
